; PlatformIO project for the ESP8266 master firmware.
; Run from this directory:
;   pio run                       build
;   pio run -t upload             flash sketch (via USB-UART, one-time only)
;   pio test -e native            run host-side unit tests
;
; Flash layout: eagle.flash.1m.ld = 1MB flash with **no** filesystem.
; The web UI and bundled unit firmware live in PROGMEM (see WebAssets.h),
; freed area is given over to OTA staging so web-OTA fits on ESP-01 1M.

[platformio]
src_dir = .
default_envs = espmaster

; Common ESPMaster build settings. Kept in its own section so the env block
; below stays minimal (board / ldscript only).
[espmaster_common]
platform = espressif8266
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_ldf_mode = deep+
; async-mqtt-client's library.json declares AsyncTCP (espressif32) as an
; alternative dependency alongside ESPAsyncTCP (espressif8266). PlatformIO's
; LDF installs and compiles both regardless of the platform filter, and the
; ESP32 AsyncTCP needs sdkconfig.h (ESP-IDF only) — fails on this ESP8266
; build. We only ever want the ESPAsyncTCP stack already pinned above, so
; tell the LDF to ignore the ESP32 variant entirely.
lib_ignore = AsyncTCP
; src_dir is the project root so exclude the test tree explicitly.
build_src_filter = +<*> -<test/>  -<.pio/>
extra_scripts = pre:build_assets.py
build_flags =
  ; ESP8266 Wire default buffer is 128 bytes. Twiboot's page-write command
  ; needs 132 bytes (4 header + 128 page) in a single transaction, so bump
  ; the Wire buffer to 256 for enough headroom.
  -DI2C_BUFFER_LENGTH=256
lib_deps =
  https://github.com/dvarrel/ESPAsyncTCP.git#1.2.4
  https://github.com/dvarrel/ESPAsyncWebSrv.git#1.2.9
  https://github.com/alanswx/ESPAsyncWiFiManager.git#3b9a58a031d32da908e205d60c7c58eedc8bd6ee
  https://github.com/marvinroger/async-mqtt-client.git#v0.9.0
  EEPROM

[env:espmaster]
extends = espmaster_common
board = esp01_1m
board_build.ldscript = eagle.flash.1m.ld

; Host-side unit tests for pure sketch logic (no Arduino hardware deps).
; Runs with: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_ldf_mode = deep+
lib_deps =
  fabiobatsilva/ArduinoFake@^0.4.0
build_flags =
  -std=gnu++17
  -D UNIT_TEST
  -D UNITS_AMOUNT=16
  -D FLAP_AMOUNT=45
  -D MIN_SPEED=1
  -D MAX_SPEED=12
