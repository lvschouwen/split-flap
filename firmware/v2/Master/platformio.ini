; PlatformIO project for the v2 master firmware — Phase 1 of epic #183:
; ESP32-S3 devkit speaking I2C to the unchanged v1 units.
; Run from this directory:
;   pio run                       build (no hardware needed)
;   pio run -t upload             flash the S3 devkit over USB
;   pio test -e native            run host-side unit tests
;
; The env targets an ESP32-S3-DevKitC-1 with the N16R8 module (16 MB flash,
; 8 MB octal PSRAM) — flags locked 2026-07-09. Nothing in Phase 1 *depends*
; on PSRAM (largeAlloc() falls back to the internal heap), it just gets used
; when present.

[platformio]
src_dir = .
default_envs = master

[env:master]
platform = espressif32
; The N16R8 board definition carries the module truth: 16 MB quad flash +
; 8 MB octal PSRAM (qio_opi), BOARD_HAS_PSRAM. A non-octal module would
; fail PSRAM init under these flags — re-check the module marking if the
; boot banner ever reports psram 0 KB.
; PIN BUDGET: octal PSRAM claims GPIO 35/36/37 — they're on the devkit
; headers but NOT usable. Route I2C and everything else around them.
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
; Custom table (rationale in the csv header) — the partition table is
; immutable over OTA, so it's shaped deliberately before the first flash.
board_build.partitions = partitions_splitflap_16MB.csv
; The prebuilt-Arduino build script does NOT read otadata's offset from the
; CSV — it flashes boot_app0.bin at a hardcoded 0xe000 unless this override
; is set (the hybrid-IDF path derives it from the CSV correctly). With the
; 64 KB nvs, otadata sits at 0x19000; keep this in sync with the CSV.
board_upload.arduino.boot_app0 = 0x19000
; Bootloader app rollback from day 0 (#187): a freshly OTA'd image boots as
; PENDING_VERIFY; the Arduino core auto-confirms it in initArduino() (so a
; binary that can't even reach setup() is rolled back by the bootloader).
; The OTA slice can override the core's weak verifyRollbackLater()/verifyOta()
; hooks to gate confirmation on real health checks. This option rebuilds the
; bootloader + framework via pioarduino's hybrid-compile (first build is slow).
custom_sdkconfig = CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
; The hybrid compile rebuilds every IDF managed component, and several we
; will never use fail to build standalone (esp-modbus config static-assert,
; libhelix ARM asm on Xtensa). Drop the media/cloud/radio extras; mDNS,
; LittleFS, WiFi and NVS stay.
custom_component_remove =
  espressif/esp-modbus
  chmorgan/esp-libhelix-mp3
  espressif/esp-sr
  espressif/esp32-camera
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_insights
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/cbor
  espressif/qrcode
  espressif/esp-dsp
  espressif/esp-zboss-lib
  espressif/esp-zigbee-lib
  espressif/esp_hosted
  espressif/esp_wifi_remote
  espressif/network_provisioning
  espressif/libsodium
; managed_components/ + sdkconfig.* are dropped into the project root by the
; hybrid IDF compile (src_dir = .); they are IDF's, not ours — never sweep
; them into the sketch build.
build_src_filter = +<*> -<test/> -<.pio/> -<managed_components/>
; Bakes data/ into WebAssets.h (PROGMEM, gzipped) + BuildVersion.h before
; every build — same mechanism as v1 (no filesystem image on the device).
extra_scripts = pre:build_assets.py
lib_deps =
  ; The maintained ESP32 successor of the v1 async stack (the mathieucarbou
  ; fork now lives in the ESP32Async org). v1's dvarrel forks stay ESP8266.
  esp32async/AsyncTCP@^3.3.2
  esp32async/ESPAsyncWebServer@^3.7.0
build_flags =
  ; Console on the S3's native USB (USB-CDC), not the UART bridge.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Task/core layout (#187): the whole network domain runs on core 0 —
  ; WiFi/LWIP are pinned there by the framework, this puts the AsyncTCP
  ; worker beside them. Core 1 belongs to the display domain (Tasks.cpp).
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  ; (BOARD_HAS_PSRAM comes from the board definition; largeAlloc()'d
  ; buffers — web log ring, future large payloads — land in PSRAM.)
  ; v1-parity display constants (Phase 1 drives the same 16-unit display).
  -D UNITS_AMOUNT=16
  -D FLAP_AMOUNT=45
  -D MIN_SPEED=1
  -D MAX_SPEED=12
  ; Shared master<->unit I2C protocol header — Phase 1 speaks the v1
  ; protocol to the v1 units, so the contract lives in v1's tree.
  -I ../../v1/shared

; Host-side unit tests for pure sketch logic (no Arduino hardware deps).
; Mirrors firmware/v1/ESPMaster [env:native] — same ArduinoFake caveats
; apply (map()/EEPROM are fakeit mocks; wire them in each test's setUp()).
; Runs with: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_ldf_mode = deep+
lib_deps =
  fabiobatsilva/ArduinoFake@^0.4.0
build_flags =
  -std=gnu++17
  -D UNIT_TEST
  -D UNITS_AMOUNT=16
  -D FLAP_AMOUNT=45
  -D MIN_SPEED=1
  -D MAX_SPEED=12
  -I ../../v1/shared
