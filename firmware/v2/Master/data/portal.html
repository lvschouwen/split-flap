<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>split-flap WiFi setup</title>
<!-- Deliberately self-contained (inline CSS/JS, no script.js/style.css):
     captive-portal webviews should render this with exactly one request. -->
<style>
  body { font-family: system-ui, sans-serif; background: #1c1c1e; color: #eee;
         max-width: 26rem; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.2rem; }
  #nets { list-style: none; padding: 0; margin: 0 0 1rem; }
  #nets li { padding: .55rem .7rem; border: 1px solid #444; border-radius: .4rem;
             margin-bottom: .35rem; cursor: pointer; display: flex;
             justify-content: space-between; gap: .5rem; }
  #nets li:hover, #nets li.sel { border-color: #e8a33d; }
  #nets .meta { color: #999; white-space: nowrap; }
  label { display: block; margin: .6rem 0 .2rem; color: #bbb; font-size: .9rem; }
  input { width: 100%; box-sizing: border-box; padding: .5rem;
          border-radius: .4rem; border: 1px solid #555; background: #2a2a2c;
          color: #eee; font-size: 1rem; }
  button { margin-top: 1rem; width: 100%; padding: .6rem; font-size: 1rem;
           border: 0; border-radius: .4rem; background: #e8a33d; color: #1c1c1e;
           cursor: pointer; }
  button:disabled { opacity: .5; }
  #status { margin-top: .8rem; color: #999; min-height: 1.2rem; }
  .err { color: #e05d5d !important; }
</style>
</head>
<body>
<h1>split-flap &mdash; connect to WiFi</h1>
<p id="scanstate">Scanning for networks&hellip;</p>
<ul id="nets"></ul>
<form id="f">
  <label for="ssid">Network name (SSID)</label>
  <input id="ssid" name="ssid" maxlength="32" autocomplete="off" required>
  <label for="pass">Password <span style="color:#777">(leave empty for open networks)</span></label>
  <input id="pass" name="pass" type="password" maxlength="63" autocomplete="off">
  <button id="save" type="submit">Save &amp; connect</button>
</form>
<p id="status"></p>
<script>
"use strict";
var polling = null;
function scan() {
  document.getElementById("scanstate").textContent = "Scanning for networks…";
  fetch("/wifi/scan", { method: "POST" }).then(function () {
    if (polling) clearInterval(polling);
    polling = setInterval(poll, 1500);
  }).catch(function () {
    document.getElementById("scanstate").textContent = "Scan failed — enter the network manually.";
  });
}
function poll() {
  fetch("/wifi/scan").then(function (r) {
    if (r.status !== 200) return null;
    return r.json();
  }).then(function (data) {
    if (!data) return;
    clearInterval(polling);
    polling = null;
    render(data.networks || []);
  }).catch(function () {});
}
function render(nets) {
  var ul = document.getElementById("nets");
  ul.innerHTML = "";
  document.getElementById("scanstate").textContent = nets.length
      ? "Tap your network, or type it below:"
      : "No networks found — enter yours manually (or rescan by reloading).";
  nets.forEach(function (n) {
    var li = document.createElement("li");
    var name = document.createElement("span");
    name.textContent = n.ssid;
    var meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = (n.secure ? "🔒 " : "") + n.rssi + " dBm";
    li.appendChild(name); li.appendChild(meta);
    li.onclick = function () {
      document.getElementById("ssid").value = n.ssid;
      Array.prototype.forEach.call(ul.children, function (c) { c.className = ""; });
      li.className = "sel";
      document.getElementById("pass").focus();
    };
    ul.appendChild(li);
  });
}
document.getElementById("f").onsubmit = function (ev) {
  ev.preventDefault();
  var status = document.getElementById("status");
  var pass = document.getElementById("pass").value;
  if (pass.length > 0 && pass.length < 8) {
    status.className = "err";
    status.textContent = "WPA2 passwords are at least 8 characters (leave empty for an open network).";
    return;
  }
  document.getElementById("save").disabled = true;
  if (polling) { clearInterval(polling); polling = null; }
  status.className = "";
  status.textContent = "Saving…";
  var body = "ssid=" + encodeURIComponent(document.getElementById("ssid").value) +
             "&pass=" + encodeURIComponent(pass);
  fetch("/wifi/config", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body
  }).then(function (r) {
    if (r.ok) {
      status.textContent = "Saved. The display is rebooting to join your network — " +
                           "reconnect this device to your own WiFi.";
    } else {
      status.className = "err";
      status.textContent = "Rejected — check the network name and password.";
      document.getElementById("save").disabled = false;
    }
  }).catch(function () {
    status.className = "err";
    status.textContent = "No response — the display may already be rebooting. " +
                         "If it isn't, try saving again.";
    document.getElementById("save").disabled = false;
  });
};
scan();
</script>
</body>
</html>
