; PlatformIO project whose ONLY product is the second-stage bootloader for
; the v2 master (#201). pioarduino's custom_sdkconfig rebuilds app-side IDF
; libs only — the Arduino build always packages a PREBUILT bootloader, so
; bootloader-side options (factory reset on GPIO 4, #193) can never be
; delivered from the Master project. This project builds the bootloader from
; ESP-IDF source with our config; the app it also produces is a stub and is
; never flashed.
;
;   pio run                            build; then copy the artifact:
;   cp .pio/build/bootloader/bootloader.bin dist/bootloader-splitflap-esp32s3.bin
;
; The committed dist/ binary is what Master's use_custom_bootloader.py embeds
; into firmware.factory.bin and what `pio run -t upload` flashes at 0x0.
; Existing boards take it with a one-time (settings/apps/rescue survive):
;   esptool --chip esp32s3 --port COMx write_flash 0x0 bootloader-splitflap-esp32s3.bin
;
; The bootloader is immutable over OTA (no A/B slot for it — never write it
; from the running app), so config changes here are day-0-per-board:
; rebuild, commit dist/, and re-flash 0x0 over USB on every deployed board.
; firmware/v2/Master/tests/test_custom_bootloader.py pins the committed
; artifact (factory-reset code present, flash header, size).

[platformio]
src_dir = src
default_envs = bootloader

[env:bootloader]
; Same pinned platform + board as ../Master — the bootloader's flash header
; (qio / 80 MHz / 16 MB) must match what the module actually runs.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = espidf
; Bootloader-relevant config lives in sdkconfig.defaults (kept out of the
; firmware/v2/*/sdkconfig.* gitignore by an explicit negation — here it is a
; source file, not a generated artifact).
