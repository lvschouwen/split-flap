; PlatformIO project for the v2 rescue app (#195) — the break-glass image
; that lives in the 2 MB `factory` partition and recovers a wall-mounted
; display whose OTA slots are both bad. Run from this directory:
;   pio run                       build (no hardware needed)
;   pio test -e native            run host-side unit tests
;
; DO NOT `pio run -t upload`: the Arduino builder would write this app at
; app0's offset, not the factory slot's. Install paths, in order of
; preference:
;   1. POST /firmware/rescue on a running master (multipart + ?md5=) — the
;      field path, works after the board is soldered in.
;   2. Bench/first-time over USB:
;        esptool.py write_flash 0x830000 .pio/build/rescue/firmware.bin
;      (factory slot offset per ../Master/partitions_splitflap_16MB.csv).
;
; This project deliberately shares NOTHING compiled with Master except the
; partition CSV (device truth, immutable over OTA) — helpers are copies, so
; Master refactors can never change a bench-proven rescue image (#195 spec).

[platformio]
src_dir = .
default_envs = rescue

[env:rescue]
; Same pioarduino platform pin as ../Master — see the rationale there.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
; The one shared file: the partition table is per-device truth (immutable
; after first flash), not a code helper — both images must agree on it.
board_build.partitions = ../Master/partitions_splitflap_16MB.csv
board_upload.arduino.boot_app0 = 0x19000
; Identical sdkconfig to Master's — APP_ROLLBACK_ENABLE is app-side
; load-bearing here: it makes this app's esp_ota_set_boot_partition() (via
; Update.end and /rescue/exit) mark the target slot ESP_OTA_IMG_NEW, so an
; image installed FROM rescue still boots PENDING_VERIFY and rides the #190
; health gate. Without it rescue would arm images pre-confirmed, bypassing
; rollback. Bootloader-side options do NOT belong here: pioarduino packages
; the prebuilt stock bootloader regardless (#201) — the #193 factory-reset
; bootloader is built by ../Bootloader and this project never flashes 0x0
; (never `pio run -t upload` rescue; see project README rules).
custom_sdkconfig =
  CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
custom_component_remove =
  espressif/esp-modbus
  chmorgan/esp-libhelix-mp3
  espressif/esp-sr
  espressif/esp32-camera
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_insights
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/cbor
  espressif/qrcode
  espressif/esp-dsp
  espressif/esp-zboss-lib
  espressif/esp-zigbee-lib
  espressif/esp_hosted
  espressif/esp_wifi_remote
  espressif/network_provisioning
  espressif/libsodium
build_src_filter = +<*> -<test/> -<.pio/> -<managed_components/>
; Bakes data/ into RescueAssets.h (PROGMEM, gzipped) + BuildVersion.h before
; every build — trimmed copy of Master's build_assets.py (two assets, no
; alphabet check).
extra_scripts =
  pre:build_assets.py
  pre:patch_asyncweb.py
lib_deps =
  ; Single-version dependency policy (CODING_STANDARDS.md §7): exact pins,
  ; identical to Master's — Rescue serves the same POST /firmware/master
  ; upload route, so it must carry the same multipart-parser fixes. Bump
  ; here and in Master/platformio.ini together (#357).
  esp32async/AsyncTCP@3.4.10
  esp32async/ESPAsyncWebServer@3.11.2
build_flags =
  ; Console on the S3's native USB (USB-CDC), same as Master.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0

; Host-side unit tests for the pure rescue logic — mirrors ../Master's
; [env:native] (same ArduinoFake caveats). Runs with: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_ldf_mode = deep+
lib_deps =
  fabiobatsilva/ArduinoFake@^0.4.0
build_flags =
  -std=gnu++17
  -D UNIT_TEST
