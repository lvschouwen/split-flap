// The link between a Split-Flap's master (ESP32-S3) and its row boards
// (ESP-01). One TCP connection per row board, opened by the row. Each message
// on it is one ToRow or ToMaster, length-delimited (a varint length, then the
// message). Generated for both boards with nanopb; field sizes are in
// wall_link.options.
// Spec: docs/superpowers/specs/2026-10-05-wall-link-and-console-design.md.
//
// Field numbers are the contract: never reuse or renumber one. Add fields and
// oneof members at the end; a board that does not know them ignores them.
syntax = "proto3";
package wl;

// ---- master -> row -------------------------------------------------------------

message Welcome {
  uint32 protocol = 1;
  string master_id = 2;
}

// Show `text` on this row. commit_at_ms is the flip instant as Unix time in
// milliseconds on the master's clock, which the row follows over NTP;
// 0, or a row without synced time, flips on arrival.
message Show {
  uint32 render_id = 1;
  uint64 commit_at_ms = 2;
  uint32 speed = 3;
  string text = 4;
}

message Quiet {
  bool on = 1;
}

enum Fallback {
  FALLBACK_BLANK = 0;
  FALLBACK_TIME = 1;
  FALLBACK_DATE = 2;
}

message Config {
  Fallback fallback = 1;          // what to show when the master is lost
  bool update_units_at_start = 2;
  string tz = 3;                  // POSIX tz rule
}

// The unit jobs a row board runs. What `arg` means is noted per job; a job
// that takes none ignores it.
enum OpCode {
  OPC_NONE = 0;
  OPC_HOME = 1;
  OPC_IDENTIFY = 2;
  OPC_JOG = 3;                    // arg = steps, -127..127
  OPC_SET_OFFSET = 4;             // arg = offset in steps
  OPC_SELF_TEST = 5;              // result: the self-test JSON in OpState.data
  OPC_RESTART_UNIT = 6;           // through its bootloader and back
  OPC_RESET_ODOMETER = 7;
  OPC_SET_GATES = 8;              // arg = feature gate bits
  OPC_BOOT_INFO = 9;              // result: the boot-info JSON in OpState.data
  OPC_BOOT_DUMP = 10;             // result: the 1024 boot-section bytes, in pieces
  OPC_BOOT_UPDATE = 11;
  OPC_UPDATE_UNITS = 12;          // address 0 = every unit that needs it;
                                  // arg 1 = even when current (one unit only)
  OPC_PROBE = 13;                 // rescan the row; address is ignored
  OPC_SET_ADDRESS = 14;           // arg = the address the unit stores and answers at
                                  // from now on (its own = keep what its switches give)
  OPC_CLEAR_ADDRESS = 15;         // forget the stored address: back to its switches
  OPC_HOME_ALL = 16;              // every unit of the row finds home again, then the
                                  // row shows its text again; address is ignored
}

// A unit job, named by the master. One job at a time per row.
message Op {
  uint32 op_id = 1;
  OpCode opcode = 2;
  uint32 address = 3;             // the unit's bus address
  sint32 arg = 4;
}

// "This is the image you should run": the row downloads it from the master
// with HTTP GET /firmware/row and checks it against size and md5 before
// installing. Every Update is answered with UpdateState.
message Update {
  string rev = 1;
  uint32 size = 2;
  bytes md5 = 3;
  bool packed = 4;                // gzip image for eboot
  uint32 http_port = 5;           // where the master serves it; 0 = 80
}

// Asks for the row's log, for this connection: what the row still holds that
// it has not sent before, then each new line as LogLine.
message LogCtl {
  bool on = 1;
}

message Ping {}
message Restart {}
message Release {}

message ToRow {
  oneof body {
    Welcome welcome = 1;
    Show show = 2;
    Quiet quiet = 3;
    Config config = 4;
    Op op = 5;
    Update update = 6;
    LogCtl log_ctl = 7;
    Ping ping = 8;
    Restart restart = 9;
    Release release = 10;
  }
}

// ---- row -> master -------------------------------------------------------------

message Hello {
  uint32 protocol = 1;
  string id = 2;
  string rev = 3;
  uint32 boot_id = 4;             // changes at every start; open jobs die with the old one
  bool rescue = 5;                // minimal boot after repeated early deaths
  uint32 width = 6;               // units on this row
}

message Status {
  uint32 up_s = 1;
  uint32 heap = 2;
  uint32 min_heap = 3;
  uint32 max_block = 4;
  sint32 rssi = 5;
  uint32 tx_power = 6;            // quarter dBm
  uint32 bus_tx = 7;
  uint32 bus_err = 8;
  bool bus_dead = 9;
  uint32 bus_episodes = 10;
  uint32 escalations = 11;
  bool busy = 12;                 // a unit job holds the loop: expect silence
  uint32 image_size = 13;
  bool time_synced = 14;
  uint32 heap2 = 15;              // free bytes in the second heap; 0 = the image has none
}

message Shown {
  uint32 render_id = 1;
  uint32 late_ms = 2;             // how far past commit_at_ms it flipped; 0 = on time
}

enum OpPhase {
  OP_RUNNING = 0;
  OP_OK = 1;
  OP_FAILED = 2;
  OP_REFUSED = 3;
}

// Why a row did not start a job.
enum OpRefusal {
  REFUSAL_NONE = 0;
  REFUSAL_UNKNOWN_OP = 1;         // this build has no such job
  REFUSAL_BUSY = 2;               // another unit job holds the row
  REFUSAL_RESCUE = 3;             // rescue mode never touches the units
  REFUSAL_BAD_ADDRESS = 4;        // outside the addresses a row can hold
  REFUSAL_NO_UNIT = 5;            // no running unit at that address
  REFUSAL_UNIT_PROTOCOL = 6;      // the unit speaks a protocol this build does not
  REFUSAL_BAD_ARG = 7;
  REFUSAL_NO_MEMORY = 8;
  REFUSAL_ADDRESS_TAKEN = 9;      // another unit answers at the address asked for
}

// A job is answered with OP_RUNNING when it starts (or OP_REFUSED at once)
// and with OP_OK or OP_FAILED when it ends. Result data longer than one
// message comes as OP_RUNNING pieces in order, the last piece on the OP_OK.
message OpState {
  uint32 op_id = 1;
  OpPhase phase = 2;
  uint32 reason = 3;              // OP_FAILED: MaintReason; OP_REFUSED: OpRefusal
  uint32 data_offset = 4;         // where this piece of the result starts
  bytes data = 5;
  uint32 outcome = 6;             // OP_FAILED: MaintOutcome
}

enum UpdatePhase {
  UPDATE_DOWNLOADING = 0;         // expect silence until the next message
  UPDATE_INSTALLED = 1;           // stored and checked; the row restarts into it
  UPDATE_FAILED = 2;              // the running image is untouched
  UPDATE_REFUSED = 3;             // not started
}

enum UpdateReason {
  UPDATE_REASON_NONE = 0;
  UPDATE_CURRENT = 1;             // this row already runs that rev
  UPDATE_UNITS_BUSY = 2;          // a unit job holds the row
  UPDATE_BAD_OFFER = 3;           // no rev, size or md5
  UPDATE_TOO_LARGE = 4;           // detail = the bytes this row can store
  UPDATE_NO_MEMORY = 5;
  UPDATE_UNREACHABLE = 6;         // no HTTP answer from the master; detail = the row's
                                  // HTTP client error without its sign (1 = no
                                  // connection, 11 = no answer in time), 0 = none
  UPDATE_HTTP_STATUS = 7;         // detail = the status
  UPDATE_SIZE_DIFFERS = 8;        // detail = the length the master's answer gave
  UPDATE_IMAGE = 9;               // not an image this board may install;
                                  // detail = OtaImageCheck, 100 = would not unpack clear of itself,
                                  // 101 = packed flag and file disagree
  UPDATE_STALLED = 10;            // detail = bytes received
  UPDATE_FLASH = 11;              // write or md5 check failed; detail = the updater's error
}

// What became of an Update, named by its rev. A result that could not be
// delivered is sent again on the next connection.
message UpdateState {
  string rev = 1;
  UpdatePhase phase = 2;
  UpdateReason reason = 3;
  uint32 detail = 4;
}

// What a row board has to say about itself, in Event.code. The master keeps
// the number in its event record: a code keeps its meaning for good.
enum RowEventCode {
  ROW_EVT_NONE = 0;
  ROW_EVT_STARTED = 1;            // a = reset reason | exception cause << 8,
                                  // b = starts since its power came on
  ROW_EVT_SELF_RESTART = 2;       // this start follows a restart the row forced on
                                  // itself: a = why (1 bus dead, 2 low memory),
                                  // b = how many of those so far
  ROW_EVT_LOW_MEMORY = 3;         // a = largest free block, bytes
}

// Something that happened on the row. Kept by the row until it can be sent,
// so `age_s` says how long ago that was when it is.
message Event {
  uint32 code = 1;                // RowEventCode
  uint32 unit = 2;                // bus address, 0 = the board itself
  uint32 a = 3;
  uint32 b = 4;
  uint32 up_s = 5;                // the row's uptime when it happened
  uint32 age_s = 6;
}

// One line of the row's log without its newline, opened by the row's uptime
// in seconds ("[123] ..."). A longer line comes in pieces.
message LogLine {
  bytes text = 1;
}

// The row's unit facts: the /units/health JSON document exactly as
// buildUnitHealthJson writes it, in pieces. doc_id ties the pieces of one
// document together; the document is complete when offset + data reaches total.
message UnitsJson {
  uint32 doc_id = 1;
  uint32 offset = 2;
  uint32 total = 3;
  bytes data = 4;
}

message Pong {}

message ToMaster {
  oneof body {
    Hello hello = 1;
    Status status = 2;
    Shown shown = 3;
    OpState op_state = 4;
    Event event = 5;
    LogLine log_line = 6;
    UnitsJson units_json = 7;
    Pong pong = 8;
    UpdateState update_state = 9;
  }
}
