; PlatformIO project for the ESP-01 cluster follower — "dumb row" firmware
; (#298, epic #270): v1 master hardware (ESP-01 + Nano row) as a cheap extra
; row of a #270 cluster wall under one S3 leader. Run from this directory:
;   pio run                       build
;   pio run -t upload             flash sketch (via USB-UART, one-time only)
;   pio test -e native            run host-side unit tests
;
; Flash layout: eagle.flash.1m.ld = 1MB flash, no filesystem — OTA-capable
; on the ESP-01's 1 MB (proven by v1 ESPMaster on this exact board). The
; bundled unit firmware lives in PROGMEM (UnitAssets.h, generated by
; build_assets.py from data/unit-firmware.hex — staged by make_manifest.py).

[platformio]
src_dir = .
default_envs = follower

[env:follower]
platform = espressif8266
framework = arduino
board = esp01_1m
board_build.ldscript = eagle.flash.1m.ld
monitor_speed = 115200
upload_speed = 115200
lib_ldf_mode = deep+
; ESPAsyncWebServer's library.json declares the ESP32 AsyncTCP as a dep;
; the LDF would compile it (needs sdkconfig.h) alongside the ESP8266-side
; ESPAsyncTCP pinned below — ignore it.
lib_ignore = AsyncTCP
; src_dir is the project root so exclude the test trees explicitly.
build_src_filter = +<*> -<test/> -<tests/> -<.pio/>
extra_scripts =
  pre:build_assets.py
  pre:patch_asyncweb.py
build_flags =
  ; ESP8266 Wire default buffer is 128 bytes. Twiboot's page-write command
  ; needs 132 bytes (4 header + 128 page) in a single transaction (v1 rule).
  -DI2C_BUFFER_LENGTH=256
  ; Shared master<->unit protocol header (SplitFlapProtocol.h) — the v1
  ; Nano units under this follower speak the v1 wire contract unchanged.
  -I ../shared
lib_deps =
  ; ESP32Async stack, unified with Master/Rescue (#356): ESPAsyncWebServer
  ; is the SAME exact version fleet-wide (CODING_STANDARDS.md §7 — bump all
  ; three platformio.inis together); ESPAsyncTCP is its ESP8266-side TCP
  ; pairing (the ESP32s use AsyncTCP instead).
  esp32async/ESPAsyncTCP@2.0.0
  esp32async/ESPAsyncWebServer@3.11.2
  https://github.com/alanswx/ESPAsyncWiFiManager.git#3b9a58a031d32da908e205d60c7c58eedc8bd6ee
  EEPROM

; Bench-only diagnostic build (#386) — the ESP-01 half of the cluster-wire
; trace: /cluster/ping arrival plus each rejection reason, readable over
; GET /log (this board has no serial; its pins are the I2C bus). Pairs with
; Master's [env:master_debug]. NEVER release or store this as the leader's
; follower image beyond a debugging session. Build with:
;   pio run -e follower_debug
[env:follower_debug]
extends = env:follower
build_flags =
  ${env:follower.build_flags}
  -D CLUSTER_WIRE_DEBUG=1

; Host-side unit tests for the pure headers (no Arduino hardware deps).
; Runs with: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_ldf_mode = deep+
lib_deps =
  fabiobatsilva/ArduinoFake@^0.4.0
build_flags =
  -std=gnu++17
  -D UNIT_TEST
  -D UNITS_AMOUNT=16
  -I ../shared
