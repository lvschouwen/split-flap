; PlatformIO project for the ESP-01 cluster follower — "dumb row" firmware
; (#298, epic #270): v1 master hardware (ESP-01 + Nano row) as a cheap extra
; row of a #270 cluster wall under one S3 leader. Run from this directory:
;   pio run                       build
;   pio run -t upload             flash sketch (via USB-UART, one-time only)
;   pio test -e native            run host-side unit tests
;
; Flash layout: eagle.flash.1m.ld = 1MB flash, no filesystem — OTA-capable
; on the ESP-01's 1 MB (proven by v1 ESPMaster on this exact board). The
; bundled unit firmware lives in PROGMEM (UnitAssets.h, generated by
; build_assets.py from data/unit-firmware.hex — staged by make_manifest.py).

[platformio]
src_dir = .
default_envs = follower

[env:follower]
platform = espressif8266
framework = arduino
board = esp01_1m
board_build.ldscript = eagle.flash.1m.ld
monitor_speed = 115200
upload_speed = 115200
lib_ldf_mode = deep+
; The LDF would compile the ESP32 AsyncTCP (needs sdkconfig.h) alongside
; the ESPAsyncTCP stack pinned below — ignore it (v1 rule).
lib_ignore = AsyncTCP
; src_dir is the project root so exclude the test trees explicitly.
build_src_filter = +<*> -<test/> -<tests/> -<.pio/>
extra_scripts = pre:build_assets.py
build_flags =
  ; ESP8266 Wire default buffer is 128 bytes. Twiboot's page-write command
  ; needs 132 bytes (4 header + 128 page) in a single transaction (v1 rule).
  -DI2C_BUFFER_LENGTH=256
  ; Shared master<->unit protocol header (SplitFlapProtocol.h) — the v1
  ; Nano units under this follower speak the v1 wire contract unchanged.
  -I ../shared
lib_deps =
  ; The dvarrel forks are the proven ESP8266 async stack (v1 rule: don't
  ; "modernize").
  https://github.com/dvarrel/ESPAsyncTCP.git#1.2.4
  https://github.com/dvarrel/ESPAsyncWebSrv.git#1.2.9
  https://github.com/alanswx/ESPAsyncWiFiManager.git#3b9a58a031d32da908e205d60c7c58eedc8bd6ee
  EEPROM

; Host-side unit tests for the pure headers (no Arduino hardware deps).
; Runs with: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_ldf_mode = deep+
lib_deps =
  fabiobatsilva/ArduinoFake@^0.4.0
build_flags =
  -std=gnu++17
  -D UNIT_TEST
  -D UNITS_AMOUNT=16
  -I ../shared
