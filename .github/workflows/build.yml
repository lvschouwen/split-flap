name: Build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '0 12 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [v2/Unit, v2/Master, v2/Rescue, v2/FollowerEsp01]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build
        working-directory: firmware/${{ matrix.project }}
        run: pio run

  test:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      # Full history: the unit-bundle drift gate walks commit ancestry.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Run Unit native tests
        working-directory: firmware/v2/Unit
        run: pio test -e native

      - name: Run v2 Master native tests
        working-directory: firmware/v2/Master
        run: pio test -e native

      - name: Run v2 Rescue native tests
        working-directory: firmware/v2/Rescue
        run: pio test -e native

      - name: Run v2 FollowerEsp01 native tests
        working-directory: firmware/v2/FollowerEsp01
        run: pio test -e native

      - name: Install pytest
        run: pip install pytest

      # #350 copied-header drift gate: the v2 copy policy prices in silent
      # divergence — this pins every declared copy pair.
      - name: Copied-header drift gate
        run: python -m pytest tests/ -v

      - name: Run v2 Master Python tests
        working-directory: firmware/v2/Master
        run: python -m pytest tests/

      - name: Run v2 Rescue Python tests
        working-directory: firmware/v2/Rescue
        run: python -m pytest tests/

      - name: Run v2 FollowerEsp01 Python tests
        working-directory: firmware/v2/FollowerEsp01
        run: python -m pytest tests/

      - name: Install flasher deps
        run: pip install pyserial==3.5 esptool==4.8.1

      - name: Run flasher tests
        working-directory: flashing
        run: python -m pytest flasher/tests/ -v

      # #205 drift gate (previously flasher.yml's collect step): a Unit code
      # change committed without re-staging the bundle must fail CI, or the
      # v2 master ships auto-pushing stale unit firmware.
      - name: Unit bundle drift gate
        working-directory: flashing
        run: python flasher/make_manifest.py gate
