name: Build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '0 12 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [v1/ESPMaster, v1/Unit, v2/Master]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        working-directory: firmware/${{ matrix.project }}
        run: pio run

  test:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run ESPMaster native tests
        working-directory: firmware/v1/ESPMaster
        run: pio test -e native

      - name: Run v2 Master native tests
        working-directory: firmware/v2/Master
        run: pio test -e native

      - name: Install pytest
        run: pip install pytest

      - name: Run Python tests
        working-directory: firmware/v1/ESPMaster
        run: python -m pytest tests/

      - name: Run v2 Master Python tests
        working-directory: firmware/v2/Master
        run: python -m pytest tests/

      - name: Install flasher deps
        run: pip install pyserial==3.5 esptool==4.8.1

      - name: Run flasher tests
        working-directory: flashing
        run: python -m pytest flasher/tests/ -v
